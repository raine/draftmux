[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/draftmux"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

# gpui is pinned to one Zed commit and has no stable API. To bump it, set the
# same new rev on both entries, match rust-toolchain.toml to Zed's at that rev,
# mirror Zed's [patch.crates-io] entries for crates in our platform graphs
# (`cargo tree --target aarch64-apple-darwin -i <crate>`), then run
# `cargo update -p gpui -p gpui_platform` and fix API changes.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b5cd310b3b54dfc659fcc06453e6358843dfe216", default-features = false }

# Mirrors Zed's root [patch.crates-io] at the pinned rev for crates in the
# gpui graph; git dependents don't inherit Zed's patches.
[patch.crates-io]
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
