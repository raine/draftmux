[package]
name = "draftmux"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
claude-convert = { path = "../claude-convert" }
clap = { version = "4.6.7", features = ["derive"] }
draftmux-storage = { path = "../storage" }
editor = { path = "../editor" }
gpui.workspace = true
gpui_platform.workspace = true
libc = "0.2"
markup = { path = "../markup" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-env = { path = "../shell-env" }
tempfile = "3.27.0"
