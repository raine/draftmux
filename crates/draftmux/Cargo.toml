[package]
name = "draftmux"
version = "0.5.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
claude-convert = { path = "../claude-convert" }
clap = { version = "4.6.7", features = ["derive"] }
draftmux-agent = { path = "../agent" }
draftmux-claude-rpc = { path = "../claude-rpc" }
draftmux-core = { path = "../core" }
draftmux-pi-profiles = { path = "../pi-profiles" }
draftmux-pi-rpc = { path = "../pi-rpc" }
draftmux-process = { path = "../process" }
draftmux-settings = { path = "../settings" }
draftmux-storage = { path = "../storage" }
dunce = "1.0.5"
editor = { path = "../editor" }
futures = "0.3"
gpui.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
markup = { path = "../markup" }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-env = { path = "../shell-env" }
sha2 = "0.10.9"
similar = "2.7.0"
tempfile = "3.27.0"
uuid = { version = "1.29.1", features = ["v4"] }

# The performance test includes the editor highlighter by path.
[package.metadata.cargo-machete]
ignored = ["comrak", "embed-resource"]

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
comrak = { version = "0.59", default-features = false }

[features]
# `draftmux capture`: renders fixture drafts to PNGs.
capture = ["dep:image", "gpui/test-support", "gpui_platform/test-support"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }
block2 = "0.6.2"
objc2 = "0.6.5"
raw-window-handle = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSPasteboard",
    "NSResponder",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSString",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
gpui_platform.workspace = true
uds_windows = "1.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
