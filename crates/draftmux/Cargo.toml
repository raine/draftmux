[package]
name = "draftmux"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
block2 = "0.6.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
claude-convert = { path = "../claude-convert" }
clap = { version = "4.6.7", features = ["derive"] }
draftmux-pi-profiles = { path = "../pi-profiles" }
draftmux-pi-rpc = { path = "../pi-rpc" }
draftmux-storage = { path = "../storage" }
editor = { path = "../editor" }
futures = "0.3"
gpui.workspace = true
gpui_platform.workspace = true
libc = "0.2"
markup = { path = "../markup" }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSPasteboard",
    "NSResponder",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSNotification",
    "NSOperation",
    "NSString",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-env = { path = "../shell-env" }
tempfile = "3.27.0"

[dev-dependencies]
futures = "0.3"
