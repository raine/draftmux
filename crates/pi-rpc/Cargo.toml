[package]
name = "draftmux-pi-rpc"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Scripted stand-in for pi used by the integration tests.
[[bin]]
name = "fake-pi"
path = "src/bin/fake-pi.rs"
test = false
doc = false

[dev-dependencies]
tempfile = "3.27.0"
