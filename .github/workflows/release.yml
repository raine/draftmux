name: Release

# A v* tag publishes a GitHub release of the signed, notarized macOS build,
# which installed copies pick up through the app's automatic updates, and of
# the x86_64 Linux build. Running
# the workflow by hand builds, signs and notarizes the same files and keeps
# them as workflow artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/draftmux/Cargo.toml | head -n 1)"
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match crates/draftmux/Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build, sign and notarize
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/release-macos
      - uses: actions/upload-artifact@v4
        with:
          name: draftmux-${{ steps.version.outputs.version }}-macos
          path: |
            target/macos-release/${{ steps.version.outputs.version }}/*.dmg
            target/macos-release/${{ steps.version.outputs.version }}/*.tar.gz
            target/macos-release/${{ steps.version.outputs.version }}/*.sha256
          if-no-files-found: error

  linux:
    # The oldest supported runner, so the binary runs on any distribution
    # with glibc 2.35 or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/draftmux/Cargo.toml | head -n 1)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libzstd-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: scripts/release-linux
      - uses: actions/upload-artifact@v4
        with:
          name: draftmux-${{ steps.version.outputs.version }}-linux
          path: |
            target/linux-release/${{ steps.version.outputs.version }}/*.tar.gz
            target/linux-release/${{ steps.version.outputs.version }}/*.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: draftmux-${{ needs.macos.outputs.version }}-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the tag's CHANGELOG.md section.
          awk -v heading="## $GITHUB_REF_NAME " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          if grep -q '[^[:space:]]' notes.md; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" "${notes[@]}"

  update-tap:
    needs: [macos, publish]
    # scripts/homebrew-cask reads the bundle ID with plutil.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raine/homebrew-draftmux
          token: ${{ secrets.RELEASE_TOKEN }}
          path: tap
      - uses: actions/download-artifact@v4
        with:
          name: draftmux-${{ needs.macos.outputs.version }}-macos
          path: dist
      - name: Write the cask and push it to the tap
        env:
          VERSION: ${{ needs.macos.outputs.version }}
        run: |
          mkdir -p tap/Casks
          scripts/homebrew-cask "$VERSION" "dist/Draftmux-$VERSION-arm64.sha256" \
            'https://github.com/raine/draftmux/releases/download/v#{version}/Draftmux-#{version}-arm64.dmg' \
            https://github.com/raine/draftmux >tap/Casks/draftmux.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/draftmux.rb
          git commit -m "draftmux $VERSION"
          git push
